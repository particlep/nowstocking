name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test (Workers runtime, local D1)
        run: npm test
      - name: Build
        run: npx vite build

  deploy:
    name: Deploy
    needs: test
    # Only the main repo deploys; forks and pull requests stop after the tests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'particlep/nowstocking'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run two deploys at once; a newer push waits for the current one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the app's version number is the commit count (vite.config.ts).
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only the hosted app and the landing page are deployed from here. The default (self-hosted) environment in
      # wrangler.jsonc is for people running their own copy.
      - name: Deploy landing page
        run: npx wrangler deploy --config site/wrangler.jsonc
      - name: Build hosted app (app.nowstocking.com)
        run: npm run build
        env:
          CLOUDFLARE_ENV: hosted
      - name: Apply hosted D1 migrations
        run: npx wrangler d1 migrations apply nowstocking-app --remote --env hosted
      - name: Deploy hosted app
        run: npx wrangler deploy
